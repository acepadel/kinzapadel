<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Kinza Padel Time Fix</title>
<style>
  :root{--bg:#EDF1F6;--surface:#fff;--ink:#0E1B2E;--muted:#5A6A80;--line:#D3DCE7;--court:#1C4C99;--ok:#1C8549;--bad:#D93A27}
  @media (prefers-color-scheme:dark){:root{--bg:#09111E;--surface:#101B2C;--ink:#E7EDF6;--muted:#8B99AF;--line:#22324A;--court:#2F6BD0;--ok:#3CC779;--bad:#FF5C49;color-scheme:dark}}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:560px;margin:0 auto;padding:28px 16px;display:grid;gap:16px}
  h1{margin:0;font-size:22px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
  label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
  input{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  button{font:inherit;font-weight:600;padding:10px 14px;border-radius:9px;border:0;background:var(--court);color:#fff;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .muted{color:var(--muted);font-size:13.5px;margin:0}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Fix match times (one time)</h1>
  <p class="muted">Every match is in the evening. This changes morning times to evening times (9:30 → 9:30 PM) and 12:xx to after midnight (12:45 → 12:45 AM). Times that are already evening are left alone. Delete this page after you run it.</p>

  <form class="card" id="login">
    <label>Scorekeeper username<input id="user" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
    <label>Password<input id="pass" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>

  <div class="card" id="panel" hidden>
    <p class="muted" id="state">Reading matches…</p>
    <div style="overflow-x:auto"><table id="list"></table></div>
    <button id="go" disabled>Fix these times</button>
    <p id="result" class="muted"></p>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyBkOtB6I3D4HajXkx4XNj7Dbsz_kliCEqQ",
    authDomain: "padeltournament-ed489.firebaseapp.com",
    projectId: "padeltournament-ed489",
    storageBucket: "padeltournament-ed489.firebasestorage.app",
    messagingSenderId: "663039407255",
    appId: "1:663039407255:web:f99230f8969a25582025d2"
  });
  const db = firebase.firestore(), auth = firebase.auth();
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const label = t => { let [h, m] = t.split(':').map(Number); h %= 24; return `${((h + 11) % 12) + 1}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}`; };
  // 1:00–11:59 → +12 h (evening); 12:xx and 00:xx → 24:xx (just after midnight). 13:00 and later stay.
  const fixed = t => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '')); if (!m) return null;
    let h = +m[1]; const mi = m[2];
    if (h >= 1 && h <= 11) h += 12; else if (h === 12 || h === 0) h = 24; else return null;
    return pad(h) + ':' + mi;
  };
  let changes = [];

  $('login').addEventListener('submit', e => {
    e.preventDefault();
    const u = $('user').value.trim().toLowerCase();
    auth.signInWithEmailAndPassword(u.includes('@') ? u : u + '@kinzapadel.com', $('pass').value)
      .catch(err => { $('login').insertAdjacentHTML('beforeend', '<p class="bad">Sign in failed: ' + err.code + '</p>'); });
  });

  auth.onAuthStateChanged(async u => {
    $('login').hidden = !!u; $('panel').hidden = !u;
    if (!u) return;
    const snap = await db.collection('matches').get();
    changes = snap.docs.map(d => ({id: d.id, ...d.data()})).map(m => ({m, to: fixed(m.time)})).filter(x => x.to)
      .sort((a, b) => (a.m.day - b.m.day) || a.m.cat.localeCompare(b.m.cat) || a.m.time.localeCompare(b.m.time));
    if (!changes.length) { $('state').textContent = 'All times are already evening times. Nothing to fix.'; return; }
    $('state').textContent = `${changes.length} matches will change:`;
    $('list').innerHTML = '<tr><th>Day</th><th>Cat</th><th>Now</th><th>Becomes</th></tr>' +
      changes.map(({m, to}) => `<tr><td>${m.day}</td><td>${m.cat}</td><td>${label(m.time)}</td><td><b>${label(to)}</b></td></tr>`).join('');
    $('go').disabled = false;
  });

  $('go').addEventListener('click', async () => {
    $('go').disabled = true;
    try {
      for (let i = 0; i < changes.length; i += 400) {
        const b = db.batch();
        changes.slice(i, i + 400).forEach(({m, to}) => b.update(db.collection('matches').doc(m.id), {time: to}));
        await b.commit();
      }
      $('result').className = 'ok'; $('result').textContent = `Done. ${changes.length} match times fixed. Open the site to check, then delete fix-times.html.`;
    } catch (err) {
      $('result').className = 'bad'; $('result').textContent = 'Failed: ' + (err.code || err.message);
      $('go').disabled = false;
    }
  });
</script>
</body>
</html>
