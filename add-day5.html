<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Kinza Padel Add Matches</title>
<style>
  :root{--bg:#EDF1F6;--surface:#fff;--ink:#0E1B2E;--muted:#5A6A80;--line:#D3DCE7;--court:#1C4C99;--ok:#1C8549;--bad:#D93A27}
  @media (prefers-color-scheme:dark){:root{--bg:#09111E;--surface:#101B2C;--ink:#E7EDF6;--muted:#8B99AF;--line:#22324A;--court:#2F6BD0;--ok:#3CC779;--bad:#FF5C49;color-scheme:dark}}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:640px;margin:0 auto;padding:28px 16px;display:grid;gap:16px}
  h1{margin:0;font-size:22px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
  label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
  input{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  button{font:inherit;font-weight:600;padding:10px 14px;border-radius:9px;border:0;background:var(--court);color:#fff;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .muted{color:var(--muted);font-size:13.5px;margin:0}
  .tw{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Add Day 5 knockout matches (one time)</h1>
  <p class="muted">Adds 20 matches for Sat 3 Oct: Category B quarter-finals (best of 3 sets, 6 games) and Category C and D round of 16 (1 set, 6 games). Matches that already exist are left untouched. Delete this page after you run it.</p>
  <form class="card" id="login">
    <label>Scorekeeper username<input id="user" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
    <label>Password<input id="pass" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
  <div class="card" id="panel" hidden>
    <p class="muted" id="state">Checking Firestore…</p>
    <div class="tw"><table id="list"></table></div>
    <button id="go" disabled>Add these matches</button>
    <p id="result" class="muted"></p>
  </div>
</main>

  const db = firebase.firestore(), auth = firebase.auth();
  const $ = id => document.getElementById(id);
  const esc = v => String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const label = t => { let [h, m] = t.split(':').map(Number); h %= 24; return `${((h + 11) % 12) + 1}:${String(m).padStart(2,'0')} ${h < 12 ? 'AM' : 'PM'}`; };
  let todo = [];
  $('login').addEventListener('submit', e => {
    e.preventDefault();
    const u = $('user').value.trim().toLowerCase();
    auth.signInWithEmailAndPassword(u.includes('@') ? u : u + '@kinzapadel.com', $('pass').value)
      .catch(err => $('login').insertAdjacentHTML('beforeend', '<p class="bad">Sign in failed: ' + esc(err.code) + '</p>'));
  });
  auth.onAuthStateChanged(async u => {
    $('login').hidden = !!u; $('panel').hidden = !u;
    if (!u) return;
    const ids = Object.keys(MATCHES);
    const have = new Set();
    for (const id of ids) { const d = await db.collection('matches').doc(id).get(); if (d.exists) have.add(id); }
    todo = ids.filter(id => !have.has(id));
    $('state').textContent = todo.length ? `${todo.length} matches to add${have.size ? ` (${have.size} already there, skipped)` : ''}:` : 'All of these matches are already in Firestore.';
    $('list').innerHTML = '<tr><th>Cat</th><th>Round</th><th>Time</th><th>Match</th></tr>' + todo.map(id => { const m = MATCHES[id];
      return `<tr><td>${m.cat}</td><td>${m.stage === 'QF' ? 'QF' : 'R16'}</td><td>${label(m.time)}${m.court ? '<br>' + esc(m.court) : ''}</td><td>${esc(m.t1)}<br>vs ${esc(m.t2)}</td></tr>`; }).join('');
    $('go').disabled = !todo.length;
  });
  $('go').addEventListener('click', async () => {
    $('go').disabled = true;
    try {
      const b = db.batch();
      todo.forEach(id => b.set(db.collection('matches').doc(id), MATCHES[id]));
      await b.commit();
      $('result').className = 'ok'; $('result').textContent = `Done. Added ${todo.length} matches. Open the site, go to Day 5, then delete add-day5.html.`;
    } catch (err) {
      $('result').className = 'bad'; $('result').textContent = 'Failed: ' + (err.code || err.message);
      $('go').disabled = false;
    }
  });
